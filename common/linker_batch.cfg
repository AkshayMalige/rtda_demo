# Link config for aieml_batch.
#
# Deliberately empty of connectivity: this design has NO PL kernels. The track
# average that used to live in track_average_pl is now an AIE kernel, and the
# host talks to the array directly over GMIO (shim DMA), so there is nothing to
# stream_connect. Compare common/linker_aieml.cfg, which routes the AIE PLIO
# output into track_average_pl.
#
# Kept as a file (rather than omitting --config) so the build is explicit about
# the fact that no PL is intended.

[connectivity]
