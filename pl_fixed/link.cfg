# PL-only design: one compute unit, no AIE, so there is nothing to
# stream_connect. gmem2 is new -- the kernel now emits the 128-wide event mean
# alongside the 27 outputs, so the analysis can apply the output dense itself
# and compare every implementation the same way.
[connectivity]
nk=rtda_split_top:1:rtda_split_top_1
sp=rtda_split_top_1.m_axi_gmem0:LPDDR
sp=rtda_split_top_1.m_axi_gmem1:LPDDR
sp=rtda_split_top_1.m_axi_gmem2:LPDDR
